name: Build & Release LockDown Browser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller LockDownBrowser.spec

      - name: Sign PyInstaller Binary
        run: powershell -ExecutionPolicy Bypass -File .\sign_binaries.ps1 -FilesToSign "dist\LockDownBrowser\LockDownBrowser.exe"
        shell: powershell

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: powershell

      - name: Compile Installer with Inno Setup
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
              if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
                  $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
                  $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
              } elseif (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") {
                  $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
              }
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc setup.iss
        shell: powershell

      - name: Sign Setup Installer
        run: powershell -ExecutionPolicy Bypass -File .\sign_binaries.ps1 -FilesToSign "Output\LockDownBrowser-Setup.exe"
        shell: powershell

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockDownBrowser-Setup
          path: |
            Output\LockDownBrowser-Setup.exe
            AnkushCodeSigning.cer
            Trust-Certificate.bat

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lock Down Browser ${{ github.ref_name }}"
          body: |
            ## 🔒 Lock Down Browser ${{ github.ref_name }}

            ### Publisher: Ankush

            ### What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Installation
            1. Download **LockDownBrowser-Setup.exe** below
            2. Run the installer and follow the steps
            3. Launch from your Desktop or Start Menu

            > **Note on Windows Defender SmartScreen:**
            > If Windows SmartScreen displays "Windows protected your PC", you can either:
            > - Click **"More info"** and click **"Run anyway"**
            > - Or right-click `LockDownBrowser-Setup.exe` -> **Properties** -> check **Unblock** -> **OK**
            > - Or download and run `Trust-Certificate.bat` as Administrator to permanently trust all apps from **Ankush**.

            ### Run from Source
            ```bash
            pip install -r requirements.txt
            python browser.py
            ```
          files: |
            Output\LockDownBrowser-Setup.exe
            AnkushCodeSigning.cer
            Trust-Certificate.bat
          draft: false
          prerelease: false
